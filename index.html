<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라누리온의 업보 장부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="floating floating-1">💜</div>
<div class="floating floating-2">✨</div>
<div class="floating floating-3">🫧</div>
<div class="floating floating-4">🎮</div>
<div class="floating floating-5">💜</div>

<main class="container">
  <header class="hero">
    <div class="mascot-wrap" aria-label="라누리온 보라색 슬라임 캐릭터 일러스트 영역">
      <div class="mascot"><img src="ranurion.png" alt="라누리온 보라색 슬라임 캐릭터" class="mascot-img">
        <div class="mascot-face">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="cheek left"></span>
          <span class="cheek right"></span>
          <span class="mouth"></span>
        </div>
        <div class="bean bean-left"></div>
        <div class="bean bean-right"></div>
      </div>
    </div>
    <h1>💜 라누리온의 업보 장부 💜</h1>
    <p>말랑말랑 보라 슬라임의 업보 기록소</p>
  </header>

  <input id="searchInput" type="text" placeholder="업보 검색하기...">
  <section id="list" class="card-list"></section>
</main>
<script src="script.js"></script>
</body>
</html>
